apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: test-credentials
  namespace: testapp
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: SecretStore
    name: azure-store
    
  target:
    name: test-credentials
    creationPolicy: Owner

  data:
  - secretKey: test-password
    remoteRef:
      key: test-password

  - secretKey: test-username
    remoteRef:
      key: test-username